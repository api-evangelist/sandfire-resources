name: Sandfire Resources

description: Sandfire Resources (Sandfire) is a global copper producer that describes its mission as mining copper sustainably
  to energise the future. Its website lists operations and projects including MATSA (Spain), Motheo (Botswana), Kalkaroo and
  DeGrussa (Australia) and Black Butte (United States), plus exploration, and it publishes ASX announcements, financial, quarterly
  and sustainability reports for investors. Sandfire is headquartered on Whadjuk Noongar land in Western Australia. No public
  developer API, documentation or developer portal was found on its site; this profile records its corporate web presence.

